name: One-off IRCnet Cryptio live test

on:
  push:
    branches: [test/ircnet-public-cybernet]
    paths: [.github/workflows/ircnet-probe.yml, tests/ircnet_live.py]

jobs:
  ircnet-cryptio:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install ZNC, ModPython and crypto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y znc znc-python python3-pycryptodome
      - name: Test Cryptio on open.ircnet.com and cybernet
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: /usr/bin/python3 tests/ircnet_live.py
