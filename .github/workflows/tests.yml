name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pycryptodomex
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install real ZNC and ngIRCd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y znc znc-python ngircd python3-pycryptodome
      - name: Test real ModPython IRC transport
        run: /usr/bin/python3 tests/znc_integration.py
